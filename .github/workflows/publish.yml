name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history and tags: the release notes are generated from the commits
      # between the previous tag and this one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 26
          cache: true

      - run: vp install --frozen-lockfile
      - run: vp run verify

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # Trusted publishing: no NPM_TOKEN. Requires the trusted publisher to be
      # configured on npmjs.com for this repo + workflow (see README).
      - name: Publish to npm
        run: |
          npm install --global npm@latest
          vp pm pack
          npm publish ./lexical-portable-text-*.tgz --access public --provenance

      # Notes are drafted from the commit log rather than `--generate-notes`,
      # which groups by merged PR — this repository commits straight to main,
      # so for v0.3.0 it listed one dependency PR and dropped the other 18
      # commits. Edit the release afterwards if the draft needs a narrative.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
