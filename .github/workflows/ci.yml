name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: 26
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test --coverage
      - run: vp pack
      # Proves the artifact npm would receive resolves and works, which
      # `vp pack` alone does not: a wrong `files` list or `exports` map
      # passes every other check and only fails for a consumer.
      - run: vp run smoke
