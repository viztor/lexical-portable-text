name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 26
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test --coverage
      - run: vp pack
      # Proves the artifact npm would receive resolves and works, which
      # `vp pack` alone does not: a wrong `files` list or `exports` map
      # passes every other check and only fails for a consumer.
      - run: vp run smoke

  # The declared `lexical` peer range is a promise to consumers. The main job
  # only ever exercises the newest version in it, so this job tests the floor.
  peer-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 26
          cache: true
      - run: vp install --frozen-lockfile
      - name: Install the minimum supported lexical
        run: |
          # Read the floor from package.json rather than pinning it here, so
          # raising the peer range moves this job with it.
          min=$(node -p "require('./package.json').peerDependencies.lexical.match(/>=\s*([0-9][^ ]*)/)[1]")
          echo "minimum peer lexical: $min"
          vp install -D \
            "lexical@$min" "@lexical/code@$min" "@lexical/headless@$min" \
            "@lexical/link@$min" "@lexical/list@$min" "@lexical/rich-text@$min"
          # Fail loudly if the swap did not actually happen: a no-op install
          # would leave this job testing the newest release while claiming to
          # test the floor.
          node -e "
            const want = process.argv[1];
            const got = require('./node_modules/lexical/package.json').version;
            if (got !== want) {
              console.error('expected lexical ' + want + ', found ' + got);
              process.exit(1);
            }
            console.log('lexical pinned to ' + got);
          " "$min"
      - run: vp check
      - run: vp test

  # `engines.node` is a published promise, and the jobs above only ever run
  # Node 26 — the top of that range. This one runs the floor and proves the
  # packed artifact still works there.
  node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          # Mirrors the floor of package.json engines.node. The assertion below
          # fails if engines is raised past this, so the two cannot drift.
          node-version: 24.11
          cache: true
      - run: vp install --frozen-lockfile
      - name: Assert this job runs at or above the engines floor
        run: |
          node -e "
            const engines = require('./package.json').engines.node;
            const floor = engines.match(/([0-9]+)\.([0-9]+)/).slice(1).map(Number);
            const running = process.versions.node.split('.').slice(0, 2).map(Number);
            const ok = running[0] > floor[0] || (running[0] === floor[0] && running[1] >= floor[1]);
            if (!ok) {
              console.error('running Node ' + process.versions.node + ' is below the engines floor ' + floor.join('.'));
              process.exit(1);
            }
            console.log('running Node ' + process.versions.node + ' satisfies engines ' + engines);
          "
      - run: vp test
      - run: vp run smoke
